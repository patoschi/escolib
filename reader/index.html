  s._epoch = paged.epoch;
  return breaks;
}
function autoFollow() {
  if (!narOn || nar.audio.paused || openId || Date.now() < nar.followMuteUntil) return;
  const s = nar.sents[nar.active];
  const r = sentRange(s);
  if (!r) return;
  const rects = [...r.getClientRects()].filter(x => x.height > 0);
  if (!rects.length) return;
  if (pagedOn()) {
    const pgFirst = pageOfRect(rects[0].left);
    const pgLast = pageOfRect(rects[rects.length - 1].left);
    let target = pgFirst;
    if (pgLast > pgFirst) {                   // split sentence: follow the playhead
      const ms = nar.audio.currentTime * 1000;
      for (const b of sentBreaks(s)) if (ms >= b.t) target = b.page;
    }
    if (paged.page === target) { nar.follow = true; return; }
    // if the user navigated far we don't chase them; following re-arms
    // on returning to the audio's page, tapping a sentence, or play
    if (!nar.follow) return;
    nar.followMuteUntil = Date.now() + 500;
    gotoPage(target);
    return;
  }
  const top = rects[0].top, bottom = rects[rects.length - 1].bottom;
  const visible = top >= 60 && bottom <= innerHeight - 80;
  if (visible) { nar.follow = true; return; }
  if (!nar.follow) return;
  if (top < 76 || bottom > innerHeight - 150) {
    nar.followMuteUntil = Date.now() + 900;   // don't re-enter during the smooth scroll
    scrollTo({ top: scrollY + top - innerHeight * 0.32, behavior:'smooth' });
  }
}
for (const ev of ['wheel', 'touchmove']) {
  addEventListener(ev, () => {
    if (!narOn) return;
    nar.followMuteUntil = Date.now() + 4000;
    nar.follow = false;        // navigating turns following off; it re-arms on return or play
    setHoverSent(-1);
  }, { passive:true });
}
addEventListener('scroll', () => { if (narOn) setHoverSent(-1); }, { passive:true });
/* when leaving the window, #doc's mouseleave may not fire */
document.addEventListener('mouseout', (e) => {
  if (narOn && !e.relatedTarget) setHoverSent(-1);
});

/* --- click on a sentence = play from there --- */
function sentAtOffset(off) {
  if (off == null) return -1;
  const arr = nar.sents;
  let lo = 0, hi = arr.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid].start <= off) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  if (ans >= 0 && off <= arr[ans].end + 1) return ans;
  return (ans + 1 < arr.length) ? ans + 1 : -1;   // click in a gap: the next one
}
/* robust seek: before the metadata loads, assigning currentTime gets
   lost and the audio starts from zero — deferred to loadedmetadata */
function narSeek(sec, andPlay) {
  const a = nar.audio;
  const go = () => {
    a.currentTime = sec;
    if (andPlay) a.play();
    narTick();
  };
  if (a.readyState >= 1) go();
  else { a.addEventListener('loadedmetadata', go, { once:true }); a.load(); }
}
let narSeekTimer = null;
doc.addEventListener('click', (e) => {
  if (!narOn || openId) return;                    // with a note open there is no navigation
  const el = e.target instanceof Element ? e.target : null;
  if (el && el.closest('.gdot, .hand, .pgx, #minibar, #cbox, mark.hl')) return;
  const sel = getSelection();
  if (sel && !sel.isCollapsed) return;             // text was being selected
  if (tapDown && Math.hypot(e.clientX - tapDown.x, e.clientY - tapDown.y) > 12) return;
  const idx = sentAtOffset(caretOffsetFromPoint(e.clientX, e.clientY));
  if (idx < 0) return;
  // deferred: the first click of a double click must NOT seek
  clearTimeout(narSeekTimer);
  narSeekTimer = setTimeout(() => {
    nar.follow = true;
    setActiveSent(idx);
    // moves the marker; keeps sounding only if it was ALREADY sounding —
    // while paused, the marker moves and playing is left to the play button
    narSeek(nar.sents[idx].start_ms / 1000 + 0.001, !nar.audio.paused);
  }, 360);
});
/* hover with the same geometry as the click (fine pointer only) */
let hoverPending = false;
doc.addEventListener('mousemove', (e) => {
  if (!narOn || openId || hoverPending || matchMedia('(pointer: coarse)').matches) return;
  hoverPending = true;
  setTimeout(() => {
    hoverPending = false;
    if (!narOn) return;
    setHoverSent(sentAtOffset(caretOffsetFromPoint(e.clientX, e.clientY)));
  }, 80);
});
doc.addEventListener('mouseleave', () => setHoverSent(-1));

/* --- keyboard in narration mode: space = play/pause, ← → = by sentence --- */
function narStep(idx) {
  if (idx < 0 || idx >= nar.sents.length) return;
  nar.follow = true;
  setActiveSent(idx);
  narSeek(nar.sents[idx].start_ms / 1000 + 0.001, !nar.audio.paused);
}
function narNext() {
  narStep(Math.min(nar.sents.length - 1, Math.max(0, nar.active + 1)));
}
function narPrev() {
  const cur = Math.max(0, nar.active);
  const intoSent = nar.audio.currentTime * 1000 - nar.sents[cur].start_ms;
  narStep(intoSent > 1500 ? cur : Math.max(0, cur - 1));     // 1st press: restarts the sentence
}
document.addEventListener('keydown', (e) => {
  if (!narOn || !nar.ready) return;
  const el = e.target instanceof Element ? e.target : null;
  if (el && el.closest('textarea, input, [contenteditable]')) return;
  if (e.key === ' ') {
    if (el && el.closest('button')) return;        // the focused button already handles space
    e.preventDefault();
    if (nar.audio.paused) nar.audio.play(); else nar.audio.pause();
  } else if (e.key === 'ArrowRight') {
    e.preventDefault();
    narNext();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    narPrev();
  }
});
$('#nb-prev').addEventListener('click', (e) => { narPrev(); e.currentTarget.blur(); });
$('#nb-next').addEventListener('click', (e) => { narNext(); e.currentTarget.blur(); });

/* --- automatic progress ---
   Progress is state, not an action: it saves itself (settled scroll,
   page change, audio playing and when the tab hides) and on open it
   resumes silently, with "Ir al inicio" as the escape hatch. Reading
   and audio are saved separately: they can diverge. */
const posKey = () => `audiolib.reader.v1.pos.${SLUG}`;
const progressPct = (off) => Math.min(100, Math.round((off / Math.max(1, doc.textContent.length)) * 100));
let progressTimer = null, restoring = true;
function saveProgress() {
  if (restoring) return;                 // don't clobber progress before restoring it
  const off = firstVisibleOffset();
  if (off == null) return;
  const p = load(posKey(), null) || {};
  p.off = off; p.y = scrollY; p.when = Date.now();
  p.pct = progressPct(off);
  if (nar.ready) { p.t = nar.audio.currentTime; p.nar = narOn; }
  save(posKey(), p);
}
function progressSoon() { clearTimeout(progressTimer); progressTimer = setTimeout(saveProgress, 1500); }
addEventListener('scroll', () => { if (!pagedOn()) progressSoon(); }, { passive: true });
addEventListener('pagehide', saveProgress);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });

function restoreProgress() {
  const p = load(posKey(), null);
  restoring = false;
  if (!p || (p.off == null && !p.y && p.t == null)) return;
  if (p.off != null) {
    if (pagedOn()) gotoOffsetPage(p.off, false);
    else {
      const r = rangeFromOffsets(p.off, Math.min(p.off + 1, doc.textContent.length));
      const rects = r ? [...r.getClientRects()].filter(x => x.height > 0) : [];
      if (rects.length) scrollTo({ top: scrollY + rects[0].top - 110 });
      else if (p.y) scrollTo({ top: p.y });
    }
  } else if (p.y) scrollTo({ top: p.y });
  if (p.t != null && nar.ready) {
    narSeek(p.t, false);
    if (p.nar) setNar(true);             // comes back paused: play to resume
  }
  if (p.off != null && progressPct(p.off) > 0) {
    toast(`Retomando donde quedaste · ${progressPct(p.off)}%`, { label: 'Ir al inicio', fn() {
      if (pagedOn()) gotoPage(0, false); else scrollTo({ top: 0 });
      progressSoon();
    }});
  }
}

/* --- bar: play / seek / speed --- */
$('#nb-play').addEventListener('click', (e) => {
  if (!nar.audio) return;
  if (nar.audio.paused) nar.audio.play(); else nar.audio.pause();
  e.currentTarget.blur();
});
$('#nb-rate').addEventListener('click', (e) => {
  nar.rateIdx = (nar.rateIdx + 1) % nar.rates.length;
  const r = nar.rates[nar.rateIdx];
  nar.audio.playbackRate = r;
  $('#nb-rate').textContent = fmtRate(r);
  prefs.rate = r; save(K_PREFS, prefs);
  e.currentTarget.blur();
});
{
  const track = $('#nb-track');
  const seekTo = (x) => {
    const rc = track.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (x - rc.left) / rc.width));
    narSeek(ratio * nar.tl.total_ms / 1000, false);
  };
  let seeking = false;
  track.addEventListener('pointerdown', (e) => {
    if (!nar.ready) return;
    seeking = true;
    track.setPointerCapture?.(e.pointerId);
    seekTo(e.clientX);
  });
  track.addEventListener('pointermove', (e) => { if (seeking) seekTo(e.clientX); });
  track.addEventListener('pointerup', () => { seeking = false; });
}

/* ╔══════════════════════════════════════════════════════════╗
   ║ 12b · Library (home)                                       ║
   ╚══════════════════════════════════════════════════════════╝ */
const HP_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>';
/* library filters: by tags + status, synced with the URL
   (./?materia=…&unidad=U1) so a filtered view can be linked */
const FILTER_KEYS = [['materia', 'Materia'], ['unidad', 'Unidad'], ['autor', 'Autor'], ['estado', 'Estado']];
const ST_LABEL = { registrada: 'pendiente', transcripta: 'transcript', curada: '' };
const ST_FILTER = { registrada: 'pendiente', transcripta: 'transcript', curada: 'lista' };
let fOpenKey = null;                       // expanded value row
function tagOf(L, key) {
  if (key === 'estado') return ST_FILTER[L.status] || 'lista';
  return L.tags?.[key] || (key === 'materia' ? (L.estante || 'Lecturas') : null);
}
function homeFilters() {
  const p = new URLSearchParams(location.search);
  const f = {};
  for (const [k] of FILTER_KEYS) if (p.get(k)) f[k] = p.get(k);
  return f;
}
function setHomeFilter(key, value) {
  const p = new URLSearchParams(location.search);
  if (value == null) p.delete(key); else p.set(key, value);
  history.replaceState(null, '', './' + (p.size ? '?' + p.toString() : ''));
  renderHome();
}
function openFicha(L) {
  const old = $('#ficha'); if (old) old.remove();
  const ov = document.createElement('div');
  ov.id = 'ficha';
  const card = document.createElement('div');
  card.className = 'ficha-card';
  const h = document.createElement('h3');
  h.textContent = L.title;
  const tags = document.createElement('div');
  tags.className = 'ficha-tags';
  const st = document.createElement('span');
  st.textContent = L.status === 'registrada' ? 'pendiente de procesar' : L.status;
  tags.appendChild(st);
  for (const [k, v] of Object.entries(L.tags || {})) {
    const s = document.createElement('span');
    s.textContent = k === 'materia' ? v : `${k}: ${v}`;
    tags.appendChild(s);
  }
  card.append(h, tags);
  const revs = L.revisiones || [];
  if (revs.length) {
    const ul = document.createElement('ul');
    ul.className = 'ficha-revs';
    for (const r of revs) {
      const li = document.createElement('li');
      li.innerHTML = '<small></small>';
      li.querySelector('small').textContent = r.fecha || '';
      li.appendChild(document.createTextNode(r.nota || ''));
      ul.appendChild(li);
    }
    card.appendChild(ul);
  } else {
    const p = document.createElement('p');
    p.className = 'ficha-empty';
    p.textContent = 'Todavía no hay texto procesado para esta lecture.';
    card.appendChild(p);
  }
  if (L.source) {
    const a = document.createElement('a');
    a.className = 'ficha-close';
    a.style.display = 'block'; a.style.textAlign = 'center'; a.style.textDecoration = 'none';
    a.href = `lectures/${L.slug}/${L.source}`;
    a.target = '_blank';
    a.textContent = 'Abrir el documento original';
    card.appendChild(a);
  }
  const close = document.createElement('button');
  close.className = 'ficha-close';
  close.textContent = 'Cerrar';
  close.onclick = () => ov.remove();
  card.appendChild(close);
  ov.appendChild(card);
  ov.addEventListener('click', (e) => { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov);
}
async function renderHome() {
  document.body.classList.add('home');
  document.title = 'escolib · biblioteca';
  const wrap = $('#home');
  wrap.hidden = false;
  const data = await fetchCatalog();
  const lects = data?.lectures || [];
  const filters = homeFilters();
  const match = (L) => Object.entries(filters).every(([k, v]) => tagOf(L, k) === v);
  const shown = lects.filter(match);
  /* grouping: by subject; within a filtered subject, by class
     (if the subject is organized in classes) or by unit */
  let groupBy = 'materia';
  if (filters.materia) {
    groupBy = shown.some(L => L.tags?.clase) ? 'clase' : 'unidad';
  }
  const shelves = new Map();
  for (const L of shown) {
    const raw = groupBy === 'clase' ? (L.tags?.clase ?? null) : tagOf(L, groupBy);
    const k = raw == null ? 'Otras' : (groupBy === 'clase' ? `Clase ${raw}` : raw);
    if (!shelves.has(k)) shelves.set(k, []);
    shelves.get(k).push(L);
  }
  const names = [...shelves.keys()];
  if (groupBy !== 'materia') names.sort((a, b) => a.localeCompare(b, 'es', { numeric: true }));
  wrap.innerHTML = '';
  const h1 = document.createElement('h1');
  h1.className = 'home-title';
  h1.textContent = 'Biblioteca';
  const sub = document.createElement('p');
  sub.className = 'home-sub';
  const legibles = shown.filter(L => L.status !== 'registrada');
  const totalMin = Math.round(legibles.reduce((a, L) => a + (L.words || 0), 0) / 210);
  sub.textContent = `${shown.length} lecturas · ${legibles.length} para leer (≈ ${totalMin} min) · ${shown.length - legibles.length} pendientes`;
  const ctl = document.createElement('div');
  ctl.className = 'home-controls';
  for (const [key, label] of FILTER_KEYS) {
    const activeVal = filters[key];
    const b = document.createElement('button');
    b.className = 'gchip' + (activeVal ? ' on' : '');
    b.textContent = activeVal ? `${label}: ${activeVal} ×` : label;
    b.onclick = () => {
      if (activeVal) { fOpenKey = null; setHomeFilter(key, null); }
      else { fOpenKey = fOpenKey === key ? null : key; renderHome(); }
    };
    ctl.appendChild(b);
  }
  wrap.append(h1, sub, ctl);
  if (fOpenKey && !filters[fOpenKey]) {
    /* possible values for the open filter, honoring the other filters */
    const others = lects.filter(L => Object.entries(filters)
      .every(([k, v]) => k === fOpenKey || tagOf(L, k) === v));
    const counts = new Map();
    for (const L of others) {
      const v = tagOf(L, fOpenKey);
      if (v != null) counts.set(v, (counts.get(v) || 0) + 1);
    }
    const vals = [...counts.keys()].sort((a, b) => a.localeCompare(b, 'es', { numeric: true }));
    const row = document.createElement('div');
    row.className = 'home-controls';
    for (const v of vals) {
      const b = document.createElement('button');
      b.className = 'gchip';
      b.textContent = `${v} (${counts.get(v)})`;
      b.onclick = () => { const k = fOpenKey; fOpenKey = null; setHomeFilter(k, v); };
      row.appendChild(b);
    }
    wrap.appendChild(row);
  }
  for (const name of names) {
    const arr = shelves.get(name);
    const st = document.createElement('div');
    st.className = 'shelf-title';
    st.innerHTML = `<span></span><small>${arr.length}</small>`;
    st.querySelector('span').textContent = name;
    wrap.appendChild(st);
    const grid = document.createElement('div');
    grid.className = 'shelf-grid';
    for (const L of arr) {
      const reg = L.status === 'registrada';
      const card = document.createElement('a');
      card.className = 'lect-card' + (reg ? ' is-reg' : '');
      if (reg && L.source) {
        // pending with an original document: open the PDF/file in another tab
        card.href = `lectures/${encodeURIComponent(L.slug)}/${encodeURIComponent(L.source)}`;
        card.target = '_blank';
        card.rel = 'noopener';
      } else if (reg) {
        card.href = '#';
        card.addEventListener('click', (e) => { e.preventDefault(); openFicha(L); });
      } else {
        card.href = './?doc=' + encodeURIComponent(L.slug);
      }
      const parts = L.title.split(' · ');
      const author = parts.length > 1 ? parts[0] : '';
      const title = parts.length > 1 ? parts.slice(1).join(' · ') : L.title;
      const pos = load(`audiolib.reader.v1.pos.${L.slug}:curated`, null)
               || load(`audiolib.reader.v1.pos.${L.slug}`, null);
      const notes = (load(`audiolib.reader.v1.notes.${L.slug}:curated`, []) || [])
        .filter(n => n.exact != null || (n.comment || '').trim()).length;
      const pct = pos?.pct ?? null;
      const min = L.words ? Math.max(1, Math.round(L.words / 210)) : null;
      const meta = [];   // catalog strings are attacker-controlled (packs): escape them
      if (L.status && L.status !== 'curada')
        meta.push(`<span class="st-chip">${escapeHtml(ST_LABEL[L.status] || L.status)}</span>`);
      if (reg && L.source)
        meta.push(`<span class="st-chip src">${escapeHtml(String(L.source).split('.').pop())}</span>`);
      const ub = L.tags?.clase ? `Clase ${L.tags.clase}` : L.tags?.unidad;
      if (ub && groupBy === 'materia') meta.push(escapeHtml(String(ub)));
      if (L.pages) meta.push(`${escapeHtml(String(L.pages))} págs.`);
      if (min) meta.push(`≈ ${min} min`);
      if (!reg && L.audio !== false) meta.push(HP_SVG);
      if (notes) meta.push(`${notes} nota${notes > 1 ? 's' : ''}`);
      if (pct != null && pct > 0) meta.push(`${pct}%`);
      card.innerHTML =
        `<p class="lect-author"></p><p class="lect-title"></p>` +
        `<p class="lect-meta">${meta.join('<span class="dot">·</span>')}</p>` +
        (pct != null && pct > 0
          ? `<span class="lect-progress"><i style="width:${Math.min(100, pct)}%"></i></span>` : '');
      card.querySelector('.lect-author').textContent = author;
      card.querySelector('.lect-title').textContent = title;
      grid.appendChild(card);
    }
    wrap.appendChild(grid);
  }
}
$('#btn-home').addEventListener('click', () => { location.href = './'; });

/* ╔══════════════════════════════════════════════════════════╗
   ║ 13 · Init                                                  ║
   ╚══════════════════════════════════════════════════════════╝ */
(async function boot() {
  if (!DOC_PARAM) {                        // no document: the library
    renderHome();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    return;
  }
  let raw = null, loadedFile = null;
  if (DOC_PARAM) {
    const candidates = FILE_PARAM ? [FILE_PARAM] : ['text', 'curated', 'transcript'];
    for (const f of candidates) {
      try {
        const res = await fetch(`lectures/${DOC_PARAM}/${f}.md`, { cache:'no-store' });
        if (res.ok) {
          raw = (await res.text()).trim();
          loadedFile = f + '.md';
          SLUG = DOC_PARAM + (f === 'text' ? '' : ':' + f);   // separate notes per variant
          PROJECT = 'Lecturas' + (f === 'text' ? '' : ' · ' + f);
          break;
        }
      } catch {}
    }
    if (raw == null) setTimeout(() => toast(`No pude cargar «${DOC_PARAM}» — muestro el texto de ejemplo`), 600);
  }
  if (raw == null) raw = $('#src').textContent.trim();
  loadNotes();
  loadBookmarks();
  renderDoc(raw);
  // migrating paragraph-anchored notes (v3-) to line offsets
  if (notes.some(n => n.blockIndex != null && n.anchorOffset == null)) {
    const blks = [...doc.querySelectorAll('.blk')];
    for (const n of notes) {
      if (n.blockIndex != null && n.anchorOffset == null) {
        const b = blks[Math.min(n.blockIndex, blks.length - 1)];
        if (b) n.anchorOffset = absOffset(b, 0);
        delete n.blockIndex;
      }
    }
    persist();
  }
  buildCbox();
  applyModeTag();
  applySize();
  repaint();
  // page mode is the default reading mode; scroll only if the user chose it
  if (prefs.paged !== false) setPaged(true);
  await initNarration(DOC_PARAM, loadedFile);
  restoreProgress();
  // with audio available, narration opens by default (paused, play to
  // start); an explicit off from the previous session is respected
  if (nar.ready && !narOn && load(posKey(), null)?.nar !== false) setNar(true);
  updateBmBtn();
  // PWA: only in a secure context (https or localhost). The SW no longer
  // precaches the library — it just keeps visited content as an offline
  // fallback (network-first) — so there is nothing to announce.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then((reg) => { if (reg.active) dlog('sw activo'); })
      .catch(() => {});
  }
})().catch((err) => {
  // a boot failure used to leave a zombie page (text visible, but no
  // notes, narration or restore, with no message) — fail loudly instead
  console.error('boot:', err);
  toast('No se pudo inicializar el reader — recargá la página');
});

})();
