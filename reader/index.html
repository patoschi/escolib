<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<title>escolib · Lector</title>
</head>
<body>

<style>
/* ============================================================
   escolib · Reader — prototype v4
   Architecture:
   · The FAB is a note-mode SWITCH (on/off). Nothing more.
   · In note mode: click/tap = note anchored to that line, in the
     nearby margin; double click/tap = highlights the word and gives
     handles to stretch the fragment. No long-press.
   · A note is ONE entity with ONE icon in the margin (bubble if
     it has a comment, marker if highlight-only) and ONE editor
     (popover next to the icon) used both to create and to edit.
   · Everything autosaves. An empty note discards itself.
   ============================================================ */

:root{
  --paper:#F6F5F1;
  --surface:#FFFFFF;
  --ink:#211F1A;
  --ink-2:#6F6A5E;
  --ink-3:#A29C8F;
  --line:#E5E2D9;
  --chrome:#26241E;
  --chrome-ink:#F6F5F1;
  --shadow:0 14px 40px rgba(33,31,26,.18), 0 3px 10px rgba(33,31,26,.10);
  --shadow-soft:0 6px 24px rgba(33,31,26,.12);
  --tag-amber:#D9A11B;
  --tag-green:#55A067;
  --tag-blue:#4A8FC4;
  --tag-pink:#CC6396;
  --tag-none:#8E887B;
  --danger:#B4503C;
  --hl-mix:32%;
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Noto Serif',serif;
  --ui:-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#171610;
    --surface:#23211A;
    --ink:#EAE7DC;
    --ink-2:#A59F8F;
    --ink-3:#6E695C;
    --line:#2E2B22;
    --chrome:#EAE7DC;
    --chrome-ink:#1C1A14;
    --shadow:0 14px 40px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.35);
    --shadow-soft:0 6px 24px rgba(0,0,0,.4);
    --tag-amber:#E2B23E;
    --tag-green:#69B37D;
    --tag-blue:#65A3D3;
    --tag-pink:#D97CA9;
    --tag-none:#8B8574;
    --danger:#D4705A;
    --hl-mix:30%;
  }
}
:root[data-theme="light"]{
  --paper:#F6F5F1; --surface:#FFFFFF; --ink:#211F1A; --ink-2:#6F6A5E; --ink-3:#A29C8F;
  --line:#E5E2D9; --chrome:#26241E; --chrome-ink:#F6F5F1;
  --shadow:0 14px 40px rgba(33,31,26,.18), 0 3px 10px rgba(33,31,26,.10);
  --shadow-soft:0 6px 24px rgba(33,31,26,.12);
  --tag-amber:#D9A11B; --tag-green:#55A067; --tag-blue:#4A8FC4; --tag-pink:#CC6396;
  --tag-none:#8E887B; --danger:#B4503C; --hl-mix:32%;
}
:root[data-theme="dark"]{
  --paper:#171610; --surface:#23211A; --ink:#EAE7DC; --ink-2:#A59F8F; --ink-3:#6E695C;
  --line:#2E2B22; --chrome:#EAE7DC; --chrome-ink:#1C1A14;
  --shadow:0 14px 40px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.35);
  --shadow-soft:0 6px 24px rgba(0,0,0,.4);
  --tag-amber:#E2B23E; --tag-green:#69B37D; --tag-blue:#65A3D3; --tag-pink:#D97CA9;
  --tag-none:#8B8574; --danger:#D4705A; --hl-mix:30%;
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--ui);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{ font-family:var(--ui); border:0; background:none; color:inherit; cursor:pointer; padding:0; }
button:focus-visible, a:focus-visible, textarea:focus-visible{
  outline:2px solid var(--ink); outline-offset:2px; border-radius:4px;
}

/* ---------- progress ---------- */
#progress{
  position:fixed; top:0; left:0; height:2px; width:0%;
  background:var(--ink); z-index:60;
}

/* ---------- top bar ---------- */
#topbar{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 18px;
  background:color-mix(in srgb, var(--paper) 82%, transparent);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border-bottom:1px solid color-mix(in srgb, var(--line) 70%, transparent);
  transform:translateY(0);
  transition:transform .32s cubic-bezier(.3,.7,.3,1);
}
#topbar.hidden{ transform:translateY(-110%); }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-badge{
  width:26px; height:26px; border-radius:7px;
  background:var(--ink); color:var(--paper);
  font-family:var(--serif); font-style:italic; font-size:17px; line-height:26px;
  text-align:center; font-weight:600;
}
.brand-name{
  font-size:12px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-2); font-weight:600;
}
.brand-name b{ color:var(--ink); font-weight:600; }
.topbar-actions{ display:flex; align-items:center; gap:4px; }
.hdr-btn{
  position:relative; width:40px; height:32px; border-radius:8px;
  display:flex; align-items:center; justify-content:center; color:var(--ink);
}
.hdr-btn:hover{ background:color-mix(in srgb, var(--ink) 8%, transparent); }
#btn-size{ font-family:var(--serif); font-size:16px; line-height:1; }
.hdr-badge{
  position:absolute; top:1px; right:2px;
  min-width:15px; height:15px; padding:0 4px;
  border-radius:8px; background:var(--ink); color:var(--paper);
  font-size:9.5px; font-weight:700; line-height:15px; text-align:center;
}

/* ---------- note-mode chip ---------- */
#modechip{
  position:fixed; z-index:55; top:50px; left:50%; transform:translateX(-50%);
  display:none; align-items:center; gap:7px;
  background:var(--chrome); color:var(--chrome-ink);
  font-size:10.5px; font-weight:500; opacity:.92;
  padding:4px 10px; border-radius:14px;
  box-shadow:var(--shadow-soft);
  max-width:calc(100vw - 24px); text-align:center; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis;
}
#modechip.on{ display:flex; animation:chipin .3s cubic-bezier(.3,1.2,.4,1) both; }
@keyframes chipin{ from{ opacity:0; transform:translateX(-50%) translateY(-8px);} to{ opacity:1; transform:translateX(-50%);} }
#modechip .pulse{
  width:6px; height:6px; border-radius:50%; flex:none;
  background:var(--mode-tag-c, var(--tag-amber));
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--mode-tag-c,var(--tag-amber)) 50%, transparent);} 50%{ box-shadow:0 0 0 5px transparent;} }
@media (max-width:560px){ #modechip{ font-size:10px; padding:4px 9px; } }

/* ---------- document ---------- */
main{ display:flex; justify-content:center; }
#doc{
  --active-tag:var(--tag-amber);
  --fs:19px;
  position:relative;
  width:100%; max-width:680px;
  padding:96px 28px 200px;
  font-family:var(--serif);
  font-size:var(--fs);
  line-height:1.72;
  touch-action:manipulation;       /* no double-tap zoom */
}
:root[data-size="0"] #doc{ --fs:17px; }
:root[data-size="2"] #doc{ --fs:21px; }
#doc ::selection{ background:color-mix(in srgb, var(--active-tag) 30%, transparent); }
#doc.mode{
  cursor:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 26 26'><path d='M3 23l2.2-6.2L18 4l4 4L9.2 20.8z' fill='%23211F1A' stroke='%23F6F5F1' stroke-width='1.6' stroke-linejoin='round'/></svg>") 3 23, text;
}
#doc.mode ::selection{ background:color-mix(in srgb, var(--active-tag) 48%, transparent); }

.doc-eyebrow{
  font-family:var(--ui); font-size:11.5px; font-weight:600;
  letter-spacing:.16em; text-transform:uppercase; color:var(--ink-2);
  margin:0 0 14px;
  animation:rise .7s cubic-bezier(.2,.7,.3,1) both;
}
#doc h1{
  font-size:clamp(1.65rem, 5.4vw, 2.15rem);
  line-height:1.22; font-weight:600; letter-spacing:-.01em;
  text-wrap:balance; margin:0 0 18px;
  animation:rise .7s cubic-bezier(.2,.7,.3,1) .06s both;
}
#doc h2.blk{
  font-size:1.3em; line-height:1.3; font-weight:600; letter-spacing:-.005em;
  margin:1.9em 0 .9em;
}
.doc-byline{
  font-family:var(--ui); font-size:13.5px; color:var(--ink-2);
  display:flex; flex-wrap:wrap; gap:6px 10px; align-items:baseline;
  margin:0 0 6px;
  animation:rise .7s cubic-bezier(.2,.7,.3,1) .12s both;
}
.doc-byline .author{ color:var(--ink); font-weight:600; }
.doc-byline .sep{ color:var(--ink-3); }
.doc-meta{
  font-family:var(--ui); font-size:12.5px; color:var(--ink-3);
  margin:0 0 26px;
  animation:rise .7s cubic-bezier(.2,.7,.3,1) .16s both;
}
.doc-lede{
  font-style:italic; font-size:1.06em; color:var(--ink-2);
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:16px 0; margin:0 0 34px;
  animation:rise .7s cubic-bezier(.2,.7,.3,1) .2s both;
}
@keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }

.blk{ margin:0 0 1.35em; }
/* e-reader style: justified body text, hyphenated so it doesn't leave rivers */
#doc p.blk{ text-align:justify; hyphens:auto; -webkit-hyphens:auto; }
#doc blockquote.blk{
  border-left:2px solid var(--line); margin-left:0; padding-left:18px;
  font-style:italic; color:var(--ink-2);
}
.colophon{
  margin-top:64px; padding-top:20px; border-top:1px solid var(--line);
  font-family:var(--ui); font-size:12px; color:var(--ink-3);
  letter-spacing:.06em; text-align:center;
}

/* ---------- highlights ---------- */
mark.hl{
  --tag:var(--tag-none);
  background:color-mix(in srgb, var(--tag) var(--hl-mix), transparent);
  color:inherit; border-radius:2px; padding:.08em 0;
  box-decoration-break:clone; -webkit-box-decoration-break:clone;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
  transition:background .2s;
}
mark.hl[data-tag="amber"]{ --tag:var(--tag-amber); }
mark.hl[data-tag="green"]{ --tag:var(--tag-green); }
mark.hl[data-tag="blue"] { --tag:var(--tag-blue); }
mark.hl[data-tag="pink"] { --tag:var(--tag-pink); }
mark.hl[data-tag="none"] { --tag:var(--tag-none); }
mark.hl.has-comment{
  border-bottom:2px dotted color-mix(in srgb, var(--tag) 85%, var(--ink));
}
mark.hl:hover{ background:color-mix(in srgb, var(--tag) 46%, transparent); }
mark.hl.flash{ animation:flash 1.1s ease-out 1; }
@keyframes flash{
  0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--tag,var(--ink)) 55%, transparent); }
  60%{ box-shadow:0 0 0 9px transparent; }
  100%{ box-shadow:0 0 0 0 transparent; }
}

/* ---------- note icon (one per note, in the margin) ---------- */
.gdot{
  --tag:var(--tag-amber);
  position:absolute;
  width:21px; height:21px;
  border-radius:50% 50% 50% 4px;
  background:var(--tag);
  border:none; padding:0; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.25);
  animation:gdotin .3s cubic-bezier(.3,1.4,.4,1) both;
  z-index:4;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}
.gdot.movable{ touch-action:none; }
.gdot::before{ content:""; position:absolute; inset:-9px; }   /* touch area */
.gdot svg{ width:11px; height:11px; color:#fff; pointer-events:none; }
.gdot[data-side="right"]{ border-radius:50% 50% 4px 50%; }
.gdot[data-tag="amber"]{ --tag:var(--tag-amber); }
.gdot[data-tag="green"]{ --tag:var(--tag-green); }
.gdot[data-tag="blue"] { --tag:var(--tag-blue); }
.gdot[data-tag="pink"] { --tag:var(--tag-pink); }
.gdot[data-tag="none"] { --tag:var(--tag-none); }
.gdot.active{ box-shadow:0 1px 4px rgba(0,0,0,.25), 0 0 0 3px color-mix(in srgb, var(--tag) 40%, transparent); }
.gdot.dragging{ opacity:.85; cursor:grabbing; z-index:9; transition:none; animation:none; }
.gdot.movable{ cursor:grab; }
@keyframes gdotin{ from{ opacity:0; transform:scale(.3);} to{ opacity:1; transform:scale(1);} }

/* ---------- highlight handles ---------- */
.hand{
  --tag:var(--tag-amber);
  position:absolute; z-index:6;
  width:17px; height:17px; border-radius:50%;
  background:var(--tag);
  border:2.5px solid var(--paper);
  box-shadow:0 1px 4px rgba(0,0,0,.3);
  cursor:grab; touch-action:none;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  margin:-8.5px 0 0 -8.5px;   /* center over the point */
}
.hand::before{ content:""; position:absolute; inset:-11px; }  /* touch area */
@media (pointer: coarse){
  .hand{ width:22px; height:22px; margin:-11px 0 0 -11px; }
  .hand::before{ inset:-14px; }
}
/* during a drag the hit-test must pass through the UI and reach the text */
body.dragging .hand, body.dragging .gdot,
body.dragging #minibar, body.dragging #cbox{ pointer-events:none; }
.hand::after{
  content:""; position:absolute; left:50%; width:2.5px; height:11px;
  background:var(--tag); transform:translateX(-50%);
}
.hand.start::after{ top:100%; }
.hand.end::after{ bottom:100%; }
.hand:active{ cursor:grabbing; }

/* page-cross arrows: extend the open highlight into the prev/next page.
   They live OUTSIDE #doc (fixed, appended to body): the column has zero
   inner padding, so any in-box placement either covers text or gets
   clipped — the page's outer margin is the only free space */
.pgx{
  --tag:var(--tag-amber);
  position:fixed; z-index:30;
  width:22px; height:22px; border-radius:50%;
  background:var(--paper); color:var(--tag);
  border:2px solid var(--tag);
  box-shadow:0 1px 4px rgba(0,0,0,.25);
  display:flex; align-items:center; justify-content:center;
  font:700 14px/1 var(--ui); padding:0 0 2px;
  cursor:pointer; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.pgx::before{ content:""; position:absolute; inset:-10px; }
@media (pointer: coarse){ .pgx{ width:26px; height:26px; font-size:16px; } }
body.dragging .pgx{ pointer-events:none; }

/* ---------- note minibar (next to the note, not covering it) ---------- */
#minibar{
  position:absolute; z-index:8;
  display:none; align-items:center; gap:2px;
  background:var(--chrome); color:var(--chrome-ink);
  border-radius:26px; padding:5px;
  box-shadow:var(--shadow);
}
#minibar.open{ display:flex; animation:pop .22s cubic-bezier(.3,1.3,.4,1) both; }
@keyframes pop{ from{ opacity:0; transform:translateY(6px) scale(.95);} to{ opacity:1; transform:none;} }
.mb-btn{
  position:relative;
  width:40px; height:40px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  color:var(--chrome-ink); flex:none;
}
.mb-btn:hover{ background:color-mix(in srgb, var(--chrome-ink) 14%, transparent); }
.mb-btn.danger:hover{ color:#fff; background:var(--danger); }
.mb-cur{
  width:17px; height:17px; border-radius:50%;
  background:var(--c); border:2.5px solid var(--chrome-ink);
}
.mb-tagdot{ width:16px; height:16px; border-radius:50%; background:var(--c); }
.mb-tagdot.none{ background:transparent; border:2px dashed var(--chrome-ink); opacity:.8; }
.mb-tagdot.sel{ box-shadow:0 0 0 2px var(--chrome), 0 0 0 4px var(--chrome-ink); }
.mb-st{
  position:absolute; top:6px; right:6px;
  width:8px; height:8px; border-radius:50%;
  background:var(--chrome-ink);
}

/* ---------- comment box (anchored to the note, in the document;
     iOS auto-scrolls to keep the field visible above the keyboard) ---------- */
#cbox{
  position:absolute; z-index:8;
  width:min(360px, calc(100% - 56px));
  background:var(--surface); color:var(--ink);
  border-left:4px solid var(--cb-tag, var(--tag-amber));
  border-radius:14px; box-shadow:var(--shadow);
  padding:10px;
  display:none; gap:8px; align-items:flex-end;
}
#cbox.open{ display:flex; animation:pop .24s cubic-bezier(.3,1.3,.4,1) both; }
#cb-text{
  flex:1; min-height:42px; max-height:140px; resize:none;
  font-family:var(--ui); font-size:15px; line-height:1.45;
  color:var(--ink); background:var(--paper);
  border:1.5px solid var(--line); border-radius:10px;
  padding:10px 12px;
}
#cb-text:focus{ outline:none; border-color:var(--ink-2); }
#cb-text::placeholder{ color:var(--ink-3); }
.cb-btn{
  width:42px; height:42px; border-radius:50%; flex:none;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink); background:color-mix(in srgb, var(--ink) 7%, transparent);
}
.cb-btn:hover{ background:color-mix(in srgb, var(--ink) 13%, transparent); }
.cb-btn.danger:hover{ color:#fff; background:var(--danger); }
.cb-btn .mb-cur{ border-color:var(--ink); }
.cb-row .mb-tagdot.none{ border-color:var(--ink); }
.cb-row .mb-tagdot.sel{ box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--ink); }
#cb-mic.off, .mb-mic.off{ opacity:.45; }
.cb-row{ display:flex; align-items:center; gap:8px; }
.cb-spacer{ flex:1; }
.cb-only-sheet{ display:none; }

/* the editor is the SAME on every device: minibar + box anchored to the
   note. The one exception is the on-screen keyboard (visualViewport
   shrinks): the box then becomes a full-width strip that reads as an
   extension of the keyboard, the playback bar hides, and the document
   shifts so the annotated fragment stays visible above the strip. */
@media (pointer:coarse){
  #cb-text{ font-size:16px; }    /* <16px triggers auto-zoom on iOS */
}
body.kb-open .cb-only-sheet{ display:flex; }
body.kb-open #minibar{ visibility:hidden; }
body.kb-open #narbar{ visibility:hidden; }
body.kb-open .pgx{ visibility:hidden; }
body.kb-open #cbox{
  position:fixed; z-index:92;
  left:0 !important; right:0 !important; width:auto;
  flex-direction:column; align-items:stretch; gap:6px;
  border-left:none; border-radius:0;
  padding:10px 14px 8px;
  background:var(--surface);
  border-top:1px solid var(--line);
  box-shadow:0 -10px 24px color-mix(in srgb, var(--ink) 8%, transparent);
  animation:none;
}
body.kb-open #cb-text{
  background:transparent; border:none; padding:6px 6px 2px; max-height:132px;
}
body.kb-open #cb-text:focus{ border:none; }
body.kb-open .cb-row{ justify-content:flex-end; }
/* with the strip up: FABs out of the way, toast at the top */
body.kb-open #fabs{ opacity:0; pointer-events:none; transition:opacity .2s; }
body.kb-open #toast{
  bottom:auto; top:calc(60px + env(safe-area-inset-top,0px));
}
#cb-mic.rec, .mb-mic.rec{
  background:var(--ink) !important; color:var(--paper) !important;
  animation:recpulse 1.5s ease-in-out infinite;
}
@keyframes recpulse{
  0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--ink) 35%, transparent); }
  50%{ box-shadow:0 0 0 7px transparent; }
}

/* ---------- table of contents ---------- */
#tocpanel{
  position:fixed; z-index:88; top:52px; right:12px;
  width:min(340px, calc(100vw - 24px)); max-height:min(60vh, 480px);
  overflow-y:auto; display:none;
  background:var(--surface); border-radius:14px;
  box-shadow:var(--shadow), 0 0 0 1px color-mix(in srgb, var(--line) 70%, transparent);
  padding:8px;
}
#tocpanel.open{ display:block; animation:pop .2s cubic-bezier(.3,1.2,.4,1) both; }
.toc-item{
  display:block; width:100%; text-align:left;
  font-family:var(--ui); font-size:13.5px; line-height:1.4; color:var(--ink);
  padding:9px 12px; border-radius:9px;
}
.toc-item:hover{ background:color-mix(in srgb, var(--ink) 7%, transparent); }
.toc-item.lvl2{ font-weight:700; }
.toc-item small{ color:var(--ink-3); font-weight:500; }

/* ---------- page mode (epub-like) ---------- */
body.paged{ height:100dvh; overflow:hidden; }
body.paged #topbar{ transform:none !important; }
body.paged main{ padding:0; }
body.paged #doc{
  margin:72px auto 0; padding:0;
  overflow:hidden;
  touch-action:manipulation;   /* pan-x fights handle dragging on iOS */
}
body.paged .gdot{ display:none; }
body.paged #doc h1{ margin-top:.4em; }
body.paged h2.blk{ break-after:avoid; }
#pageinfo{
  position:fixed; z-index:60; left:50%; transform:translateX(-50%);
  bottom:calc(10px + env(safe-area-inset-bottom,0px));
  display:flex; align-items:center; gap:4px;
  font-family:var(--ui); font-size:12px; color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
#pageinfo[hidden]{ display:none; }
#pageinfo button{
  height:38px; border-radius:10px; color:var(--ink);
  font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center;
}
#pg-prev{ padding:0 12px 0 34px; }

# A la deriva

> Horacio Quiroga · Cuentos de amor, de locura y de muerte · 1917. Cuento. Publicado por primera vez en la revista Fray Mocho (1912). Texto de dominio público, tomado de Wikisource.

El hombre pisó algo blanduzco, y enseguida sintió la mordedura en el pie. Saltó adelante, y al volverse con un juramento vio una yararacusú que arrollada sobre sí misma, esperaba otro ataque.

El hombre echó una veloz ojeada a su pie, donde dos gotitas de sangre engrosaban dificultosamente, y sacó el machete de la cintura. La víbora vio la amenaza, y hundió más la cabeza en el centro mismo de su espiral; pero el machete cayó de plano, dislocándole las vértebras.

El hombre se bajó hasta la mordedura, quitó las gotitas de sangre, y durante un instante contempló. Un dolor agudo nacía de los dos puntitos violetas, y comenzaba a invadir todo el pie. Apresuradamente se ligó el tobillo con su pañuelo y siguió por la picada hacia su rancho.

El dolor en el pie aumentaba, con sensación de tirante abultamiento, y de pronto el hombre sintió dos o tres fulgurantes puntadas que,  como relámpagos habían irradiado desde la herida hasta la mitad de la pantorrilla. Movía la pierna con dificultad; una metálica sequedad de garganta, seguida de sed quemante, le arrancó un nuevo juramento.

Llegó por fin al rancho, y se echó de brazos sobre la rueda de un trapiche. Los dos puntitos violeta desaparecían ahora en la monstruosa hinchazón del pie entero. La piel parecía adelgazada y a punto de ceder, de tensa. Quiso llamar a su mujer, y la voz se quebró en un ronco arrastre de garganta reseca. La sed lo devoraba.

—¡Dorotea! —alcanzó a lanzar en un estertor—. ¡Dame caña!

  // vertical limit in VIEWPORT coords: the page box, and the comment card
  let maxY = docRect.top + doc.clientHeight - 32;
  const cb = $('#cbox');
  if (cb && cb.classList.contains('open')) {

    if (ct > docRect.top + 40) maxY = Math.min(maxY, ct);

    b.style.setProperty('--tag', tagCss(n.tag));
    b.style.left = Math.max(4, Math.min(vx, innerWidth - 30)) + 'px';
    b.style.top = Math.max(docRect.top + 4, Math.min(vy, maxY)) + 'px';
    if (!b.parentNode) document.body.appendChild(b);

  // over the highlight, half in, half out. The anchor is the rect of the
  // EDGE CHARACTER on this page (whole-range rects fragment/merge in
  // non-visual order, which used to land the arrow mid-line).
  const edgeOffset = (side) => {          // fragment offset at this page's edge

        if (pm != null && pm > paged.page) hi = mid - 1; else lo = mid;
      } else {
        const mid = (lo + hi) >> 1;

      }
    }
    return null;
  };

  // height of its edge line (viewport coords: these nodes hang off body)
  const pw = prevWordStart(n.start);
  const ppg = pw == null ? null : pageOfOffset(pw);
  const rcS = (ppg != null && ppg < paged.page) ? charRect(edgeOffset('start')) : null;
  if (rcS) put(pgxPrev, docRect.left - 36, rcS.top + rcS.height / 2 - 13);
  else pgxPrev.remove();
  const nw = nextWordEnd(n.end);
  const npg = nw == null ? null : pageOfOffset(nw - 1);
  const rcE = (npg != null && npg > paged.page) ? charRect(edgeOffset('end')) : null;

function positionBar() {

  const take = (rects) => {
    top = Math.min(...rects.map(rc => rc.top));
    bottom = Math.max(...rects.map(rc => rc.bottom));
    left = Math.min(...rects.map(rc => rc.left));
    right = Math.max(...rects.map(rc => rc.right));

    const r = rangeFromOffsets(n.start, n.end);
    let rects = r ? [...r.getClientRects()].filter(x => x.height > 0) : [];

    // anchor only to what is visible on the current page
    if (pagedOn()) {
      const vis = rects.filter(rc => pageOfRect(rc.left) === paged.page);
      if (vis.length) rects = vis;

  const limit = pagedOn() ? docRect.top + doc.clientHeight - 8 : innerHeight - 110;
  let y = bottom - docRect.top + 26;

  bar.style.top = Math.max(4, y) + 'px';

  // inside the current page box
  const sx = doc.scrollLeft;
  const boxL = pagedOn() ? sx : 0;
  const boxR = boxL + doc.clientWidth;
  let x = (left + right) / 2 - docRect.left + sx - barW / 2;
  x = Math.max(boxL + 8, Math.min(x, boxR - barW - 8));
  bar.style.left = x + 'px';
  bar.style.right = 'auto';
}

  const r = new SR();
  r.lang = 'es-AR';

  r.onresult = (e) => {
    let fin = '', interim = '';

  const r = s.getRangeAt(0);
  const start = absOffset(r.startContainer, r.startOffset);
  const end   = absOffset(r.endContainer, r.endOffset);
  if (end <= start) return false;
  const rect = r.getBoundingClientRect();

  const side = (rect.left + rect.width / 2 - docRect.left) < docRect.width / 2 ? 'left' : 'right';
  attachFragment(start, end, side);
  return true;
}

/* --- double tap = note --- */
function sideFromX(x) {

  return (x - rect.left) < rect.width / 2 ? 'left' : 'right';
}
function doubleTap(x, y) {
  const off = caretOffsetFromPoint(x, y);

  const w = wordBoundsAt(off);
  if (!w) return;
  // if the open note has no fragment yet, the highlight is added to it
  const n = openNote();
  if (n && hasFrag(n)) closeEditor();
  attachFragment(w[0], w[1], sideFromX(x));

/* router: only detects the double tap; there is no single-tap action.
   A swipe also ends in a pointerup: if the pointer moved more than

let tapDown = null;

  const x = e.clientX, y = e.clientY;
  if (tapDown && Math.hypot(x - tapDown.x, y - tapDown.y) > 12) {
    lastTap = { t: 0, x: 0, y: 0 };          // it was a drag/swipe
    return;
  }
  const now = performance.now();
  const isDbl = (now - lastTap.t < 400) && Math.hypot(x - lastTap.x, y - lastTap.y) < 36;
  lastTap = { t: now, x, y };
  if (!isDbl) return;
  pauseNar();                    // annotating pauses the audio; play to resume
  dismissHint();
  doubleTap(x, y);
  // the browser still fires the 2nd tap's click AFTER this pointerup, and
  // its target predates the new <mark> — without this, that ghost click

/* tapping a highlight or icon opens the editor (and pauses narration) */
let suppressClickUntil = 0;      // the ghost click right after a double-tap creation
doc.addEventListener('click', (e) => {
  if (performance.now() < suppressClickUntil) return;
  const hit = e.target.closest('mark.hl, .gdot');
  if (hit) { e.stopPropagation(); pauseNar(); openEditor(hit.dataset.id); return; }
  if (openId && !e.target.closest('#minibar, #cbox, .hand, .pgx')) closeEditor();

document.addEventListener('click', (e) => {
  if (performance.now() < suppressClickUntil) return;

/* ╔══════════════════════════════════════════════════════════╗
   ║ 8 · Handles: stretching the fragment                       ║
   ╚══════════════════════════════════════════════════════════╝ */
/* two paths: pointer events for mouse/pen, touch events for the finger.
   On iOS, preventDefault on touchstart is the only thing that guarantees
   the browser won't steal the gesture for scroll or native selection. */
let dragHand = null;   // { which:'start'|'end', n, touch, dy }
function startHandDrag(h, touch, y0) {
  const n = openNote();
  if (!n || !hasFrag(n)) return false;
  const which = h.classList.contains('start') ? 'start' : 'end';
  // remember the finger↔line offset: the circle hangs off the line,
  // and the sampling point must land on the line, not on the handle
  let dy = 0;
  const r = rangeFromOffsets(n.start, n.end);
  const rects = r ? [...r.getClientRects()].filter(x => x.height > 0) : [];
  if (rects.length && y0 != null) {
    const line = which === 'start' ? rects[0] : rects[rects.length - 1];
    dy = y0 - (line.top + line.height / 2);
  }
  dragHand = { which, n, touch, dy };
  document.body.classList.add('dragging');
  document.body.style.userSelect = 'none';
  document.body.style.webkitUserSelect = 'none';
  return true;
}
/* column (page) that a text offset is laid out in, or null in the gaps */
function pageOfOffset(off) {
  const r = rangeFromOffsets(off, off + 1);
  if (!r) return null;
  for (const rc of r.getClientRects()) if (rc.width || rc.height) return pageOfRect(rc.left);
  return null;
}
function moveHandDrag(x, y) {
  const off = caretOffsetFromPoint(x, y - (dragHand.dy || 0));
  if (!dragHand.logged) { dragHand.logged = 1; dlog('drag off=' + off + ' rango=' + dragHand.n.start + '-' + dragHand.n.end); }
  if (off == null) return;
  // a drag can only target the visible page: WebKit's hit-testing near the
  // page edges (iPad) resolves margin points into ANOTHER column, which
  // used to balloon the fragment across pages — those moves are ignored
  // (crossing pages is what the .pgx arrows are for)
  if (pagedOn()) {
    const pg = pageOfOffset(off);
    if (pg != null && pg !== paged.page) return;
  }
  const n = dragHand.n;
  if (dragHand.which === 'start') {
    const ns = Math.min(snapStart(off), n.end - 1);
    if (ns !== n.start) { n.start = ns; scheduleDragPaint(); }
  } else {
    const ne = Math.max(snapEnd(off), n.start + 1);
    if (ne !== n.end) { n.end = ne; scheduleDragPaint(); }
  }
}
function endHandDrag() {
  if (!dragHand) return;
  const n = dragHand.n;
  n.exact = doc.textContent.slice(n.start, n.end);
  dragHand = null;
  document.body.classList.remove('dragging');
  document.body.style.userSelect = '';
  document.body.style.webkitUserSelect = '';

}
/* separate paths: the finger goes through touch events (on iOS,
   preventing touchstart makes the browser abort the pointer path with an
   immediate pointerup — that phantom pointerup must NOT end the drag);
   mouse and pen go through pointer events */
doc.addEventListener('pointerdown', (e) => {
  const h = e.target instanceof Element ? e.target.closest('.hand') : null;
  if (!h || e.pointerType === 'touch') return;
  dlog('hand pointerdown ' + e.pointerType);
  e.preventDefault();
  if (!dragHand && startHandDrag(h, false, e.clientY)) h.setPointerCapture?.(e.pointerId);
});
doc.addEventListener('touchstart', (e) => {
  const h = e.target instanceof Element ? e.target.closest('.hand') : null;
  if (!h) return;
  dlog('hand touchstart');
  e.preventDefault();
  if (!dragHand) startHandDrag(h, true, e.touches[0]?.clientY);
}, { passive:false });
document.addEventListener('pointermove', (e) => {
  if (!dragHand || dragHand.touch) return;
  e.preventDefault();
  moveHandDrag(e.clientX, e.clientY);
}, { passive:false });
document.addEventListener('touchmove', (e) => {
  if (!dragHand?.touch) return;
  e.preventDefault();
  const t = e.touches[0];
  if (t) moveHandDrag(t.clientX, t.clientY);
}, { passive:false });
document.addEventListener('pointerup', () => { if (dragHand && !dragHand.touch) { dlog('hand end (pointerup)'); endHandDrag(); } });
document.addEventListener('pointercancel', () => { if (dragHand && !dragHand.touch) { dlog('hand end (POINTERCANCEL)'); endHandDrag(); } });
document.addEventListener('touchend', () => { if (dragHand?.touch) { dlog('hand end (touchend)'); endHandDrag(); } });
document.addEventListener('touchcancel', () => { if (dragHand?.touch) { dlog('hand end (TOUCHCANCEL)'); endHandDrag(); } });
let dragPaintPending = false;
function scheduleDragPaint() {
  if (dragPaintPending) return;

  requestAnimationFrame(() => {
    dragPaintPending = false;
    const n = dragHand?.n || openNote();
    if (n && hasFrag(n)) n.exact = doc.textContent.slice(n.start, n.end);
    repaint();
  });
}

/* ╔══════════════════════════════════════════════════════════╗
   ║ 9 · Draggable icon (notes without fragment)                ║
   ╚══════════════════════════════════════════════════════════╝ */
let dragDot = null;   // { el, n, x0, y0, moved, touch }
function startDotDrag(g, x, y, touch) {
  const n = note(g.dataset.id);
  if (!n || hasFrag(n)) return;
  dragDot = { el:g, n, x0:x, y0:y, moved:false, touch };
}
function moveDotDrag(x, y) {
  if (!dragDot.moved && Math.hypot(x - dragDot.x0, y - dragDot.y0) < 7) return false;
  dragDot.moved = true;
  document.body.classList.add('dragging');
  document.body.style.userSelect = 'none';
  const docRect = doc.getBoundingClientRect();
  dragDot.el.classList.add('dragging');
  dragDot.el.style.top = (y - docRect.top - 10) + 'px';
  const side = sideFromX(x);
  if (side !== dragDot.el.dataset.side) {
    dragDot.el.dataset.side = side;
    dragDot.el.style.left = side === 'left' ? '3px' : 'auto';
    dragDot.el.style.right = side === 'right' ? '3px' : 'auto';
  }
  return true;
}
function endDotDrag(x, y) {
  const { n, moved } = dragDot;
  dragDot.el.classList.remove('dragging');
  document.body.classList.remove('dragging');
  document.body.style.userSelect = '';
  dragDot = null;
  if (!moved) return false;                    // it was a tap: the router handles it
  const off = caretOffsetFromPoint(x, y);
  if (off != null) { n.anchorOffset = off; n.side = sideFromX(x); persist(); }
  repaint();
  if (openId === n.id) positionBar();
  return true;
}
doc.addEventListener('pointerdown', (e) => {
  const g = e.target instanceof Element ? e.target.closest('.gdot.movable') : null;
  if (!g || e.pointerType === 'touch') return;
  startDotDrag(g, e.clientX, e.clientY, false);
  g.setPointerCapture?.(e.pointerId);
});
document.addEventListener('pointermove', (e) => {
  if (!dragDot || dragDot.touch) return;
  if (moveDotDrag(e.clientX, e.clientY)) e.preventDefault();
}, { passive:false });
document.addEventListener('pointerup', (e) => {
  if (!dragDot || dragDot.touch) return;
  endDotDrag(e.clientX, e.clientY);
});
doc.addEventListener('touchstart', (e) => {
  const g = e.target instanceof Element ? e.target.closest('.gdot.movable') : null;
  if (!g || !e.touches[0]) return;
  startDotDrag(g, e.touches[0].clientX, e.touches[0].clientY, true);
}, { passive:true });
document.addEventListener('touchmove', (e) => {
  if (!dragDot?.touch) return;
  const t = e.touches[0];
  if (t && moveDotDrag(t.clientX, t.clientY)) e.preventDefault();
}, { passive:false });
document.addEventListener('touchend', (e) => {
  if (!dragDot?.touch) return;
  const t = e.changedTouches[0];
  endDotDrag(t ? t.clientX : dragDot.x0, t ? t.clientY : dragDot.y0);
});

/* ╔══════════════════════════════════════════════════════════╗
   ║ 10 · Notes panel                                           ║
   ╚══════════════════════════════════════════════════════════╝ */
const drawer = $('#drawer');
function notePos(n){ return hasFrag(n) ? n.start : (n.anchorOffset ?? 0); }
function openDrawer() {
  renderDrawer();
  drawer.classList.add('open');
  if (matchMedia('(max-width: 899px)').matches) $('#scrim').classList.add('on');
}
function closeDrawer() {
  drawer.classList.remove('open');
  $('#scrim').classList.remove('on');
}
$('#btn-notes').addEventListener('click', () => {
  if (drawer.classList.contains('open')) closeDrawer(); else openDrawer();
});
$('#drawer-close').onclick = closeDrawer;
$('#scrim').addEventListener('click', closeDrawer);

function renderDrawer() {
  const valid = notes.filter(isValid);
  $('#drawer-count').textContent = valid.length ? `· ${valid.length}` : '';
  const fWrap = $('#drawer-filters');
  fWrap.innerHTML = '';
  const mk = (key, label, colorCss, hollow) => {
    const c = document.createElement('button');
    c.className = 'fchip' + (hollow ? ' none' : '');
    if (colorCss) c.style.setProperty('--c', colorCss);
    c.setAttribute('aria-pressed', String(drawerFilter === key));
    const count = key === 'all' ? valid.length
                : key === 'untagged' ? valid.filter(n => !n.tag).length
                : valid.filter(n => n.tag === key).length;
    c.innerHTML = ((colorCss || hollow) ? '<span class="dot"></span>' : '') + `<span>${label}</span>` + (count ? ` <span style="opacity:.55">${count}</span>` : '');
    c.onclick = () => { drawerFilter = key; renderDrawer(); };
    fWrap.appendChild(c);
  };
  mk('all', 'Todas', null, false);
  for (const k of TAG_KEYS) mk(k, TAGS[k].label, TAGS[k].css, false);
  mk('untagged', 'Sin tag', null, true);

  const list = $('#drawer-list');
  list.innerHTML = '';
  const shown = valid
    .filter(n => drawerFilter === 'all' || (drawerFilter === 'untagged' ? !n.tag : n.tag === drawerFilter))
    .sort((a,b) => notePos(a) - notePos(b));

  if (!shown.length) {
    const e = document.createElement('div');
    e.className = 'drawer-empty';
    e.innerHTML = valid.length
      ? 'No hay notas con este tag.'
      : '<span class="big">Sin notas todavía</span>Doble toque sobre una palabra para resaltarla y anotar; después estirá la selección con las manijas.';
    list.appendChild(e);
    return;
  }
  for (const n of shown) {
    const item = document.createElement('div');
    item.className = 'note-item';
    item.setAttribute('role','button');
    item.tabIndex = 0;
    item.style.setProperty('--tag', tagCss(n.tag));
    let html = '';
    if (hasFrag(n)) html += `<p class="note-quote">“${escapeHtml(truncate(n.exact, 140))}”</p>`;
    if (n.comment.trim()) html += `<p class="note-comment">${escapeHtml(n.comment)}</p>`;
    html += `<div class="note-foot"><span class="note-tagname">${n.tag ? TAGS[n.tag].label : (hasFrag(n) ? '' : 'Al margen')}${n.orphan ? ' · sin anclar' : ''}</span>
      <button class="note-del" aria-label="Eliminar nota" title="Eliminar">${TRASH_SVG}</button></div>`;
    item.innerHTML = html;
    item.querySelector('.note-del').onclick = (e) => { e.stopPropagation(); removeNote(n.id); };
    const go = () => {
      closeDrawer();
      gotoNote(n);
    };
    item.onclick = go;
    item.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
    list.appendChild(item);
  }
}
function gotoNote(n) {
  if (pagedOn()) {
    gotoOffsetPage(notePos(n), false);
    setTimeout(() => { flashNote(n.id); openEditor(n.id); }, 150);
    return;
  }
  const target = hasFrag(n)
    ? doc.querySelector(`mark.hl[data-id="${n.id}"]`)
    : doc.querySelector(`.gdot[data-id="${n.id}"]`);
  if (!target) return;
  target.scrollIntoView({ block:'center', behavior:'smooth' });
  setTimeout(() => { flashNote(n.id); openEditor(n.id); }, 380);
}
function truncate(s, n){ return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; }

let toastTimer = null;

  span.textContent = msg;
  t.appendChild(span);
  if (action) {
    const b = document.createElement('button');
    b.className = 't-act';
    b.textContent = action.label;
    b.onclick = () => { t.classList.remove('on'); action.fn(); };
    t.appendChild(b);
  }
  t.classList.add('on');

}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (tocpanel.classList.contains('open')) toggleToc(false);
  else if (drawer.classList.contains('open')) closeDrawer();
  else if (cbox.classList.contains('open')) { closeCbox(); renderBar(); }
  else if (openId) closeEditor();
  else if (narOn) setNar(false);
});

let lastY = 0, ticking = false;
addEventListener('scroll', () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const max = document.documentElement.scrollHeight - innerHeight;
    $('#progress').style.width = (max > 0 ? Math.min(100, (scrollY / max) * 100) : 0) + '%';
    const bar = $('#topbar');
    if (scrollY > 90 && scrollY > lastY + 4) bar.classList.add('hidden');

    ticking = false;
  });
}, { passive:true });

addEventListener('resize', () => {

    repaint();
  }, 150);
});

/* --- TOC: ## headings and "§ N." section starts --- */
const tocpanel = $('#tocpanel');

let LECTURES = [];

  for (const f of ['lectures/index.local.json', 'lectures/index.json']) {

}

    else if (el.tagName === 'H2') out.push({ el, label: t, lvl: 2 });

  }
  if (!tocpanel.childNodes.length) {

    h.className = 'toc-head';
    h.textContent = 'Lecturas';
    tocpanel.appendChild(h);
    for (const L of LECTURES) {
      if (L.status === 'registrada') continue;   // no text: just a card on the home
      const b = document.createElement('button');
      const current = DOC_PARAM === L.slug;
      b.className = 'toc-item' + (current ? ' lvl2' : '');
      b.textContent = (current ? '· ' : '') + L.title;
      b.onclick = () => { if (!current) location.href = './?doc=' + L.slug; };
      tocpanel.appendChild(b);
    }
  }
  if (bookmarks.length) {

    h.className = 'toc-head';

    for (const bm of [...bookmarks].sort((a, b) => a.off - b.off)) {
      const row = document.createElement('div');

        ev.stopPropagation();
        bookmarks = bookmarks.filter(x => x.id !== bm.id);

      };
      row.appendChild(del);

    }

/* --- bookmarks (ribbon): toggle on the current view, like an e-reader --- */
let bookmarks = [];

function loadBookmarks() { bookmarks = load(bmKey(), []); }
function saveBookmarks() { save(bmKey(), bookmarks); updateBmBtn(); }

  const out = [];
  for (const bm of bookmarks) {
    const r = rangeFromOffsets(bm.off, Math.min(bm.off + 1, doc.textContent.length));
    const rects = r ? [...r.getClientRects()].filter(x => x.height > 0) : [];
    if (!rects.length) continue;
    if (pagedOn()) { if (pageOfRect(rects[0].left) === paged.page) out.push(bm); }
    else if (rects[0].top >= 56 && rects[0].top <= innerHeight - 40) out.push(bm);
  }

}
function updateBmBtn() {

  $('#btn-bm').title = onIt ? 'Quitar marcador' : 'Marcar esta página';
}
function gotoBookmark(bm) {
  if (pagedOn()) { gotoOffsetPage(bm.off, false); return; }
  const r = rangeFromOffsets(bm.off, Math.min(bm.off + 1, doc.textContent.length));
  const rects = r ? [...r.getClientRects()].filter(x => x.height > 0) : [];
  if (rects.length) scrollTo({ top: scrollY + rects[0].top - 110, behavior: 'smooth' });
}

  } else {
    let off = firstVisibleOffset();
    if (off == null) return;
    off = snapStart(off);              // readable excerpt: from a word start
    bookmarks.push({ id: uid(), off, when: Date.now() });

let bmScrollTimer = null;
addEventListener('scroll', () => {

}, { passive: true });
$('#btn-toc').addEventListener('click', (e) => { e.stopPropagation(); toggleToc(); });
document.addEventListener('click', (e) => {
  if (tocpanel.classList.contains('open') &&
      !(e.target instanceof Element && e.target.closest('#tocpanel, #btn-toc'))) toggleToc(false);

function gotoElement(el) {
  if (pagedOn()) {
    const rc = el.getBoundingClientRect();

/* --- page mode: CSS columns as wide as the view; the DOM doesn't

const paged = { page: 0, pages: 1, stride: 1, epoch: 0 };
const pagedOn = () => document.body.classList.contains('paged');
const PG_GAP = 48, PG_TOP = 72, PG_BOTTOM = 54;

function firstVisibleOffset() {
  const r = doc.getBoundingClientRect();
  return pagedOn()
    ? caretOffsetFromPoint(r.left + 40, r.top + 30)
    : caretOffsetFromPoint(r.left + r.width / 2, Math.max(r.top + 12, 96));
}
function layoutPages(anchorOff = null) {
  if (!pagedOn()) return;
  const w = Math.min(680 - 56, innerWidth - 48);
  // if the document has narration, the bar's space is ALWAYS reserved:
  // toggling narration on/off never repaginates (stable pages)
  const h = innerHeight - PG_TOP - PG_BOTTOM - (nar.ready ? 66 : 0);
  doc.style.width = w + 'px';
  doc.style.height = h + 'px';
  doc.style.columnWidth = w + 'px';
  doc.style.columnGap = PG_GAP + 'px';
  paged.stride = w + PG_GAP;
  paged.pages = Math.max(1, Math.round((doc.scrollWidth + PG_GAP) / paged.stride));
  paged.epoch++;

}
function gotoPage(i, smooth = true) {
  i = Math.max(0, Math.min(i, paged.pages - 1));
  paged.page = i;
  doc.scrollTo({ left: i * paged.stride, top: 0, behavior: smooth ? 'smooth' : 'auto' });
  $('#pg-num').textContent = `${i + 1} / ${paged.pages}`;
  $('#progress').style.width = (paged.pages > 1 ? (i / (paged.pages - 1)) * 100 : 100) + '%';
  progressSoon();
  updateBmBtn();
  renderPgx();             // the arrows' visibility depends on the current page
}
function pageOfRect(clientLeft) {

  // with round, anything past 50% of the width "fell" onto the next page
  return Math.floor((clientLeft - doc.getBoundingClientRect().left + doc.scrollLeft) / paged.stride);
}
function gotoOffsetPage(off, smooth = true) {
  if (off == null) return;
  const r = rangeFromOffsets(off, Math.min(off + 1, doc.textContent.length));
  const rects = r ? [...r.getClientRects()].filter(x => x.width || x.height) : [];
  if (rects.length) gotoPage(pageOfRect(rects[0].left), smooth);
}
function setPaged(on) {
  const anchor = firstVisibleOffset();
  document.body.classList.toggle('paged', on);
  $('#btn-paged').setAttribute('aria-pressed', String(on));
  $('#pageinfo').hidden = !on;
  prefs.paged = on; save(K_PREFS, prefs);
  if (on) layoutPages(anchor);
  else {
    doc.style.width = doc.style.height = doc.style.columnWidth = doc.style.columnGap = '';
    doc.scrollLeft = 0;
    const r = anchor != null ? rangeFromOffsets(anchor, anchor + 1) : null;
    const rects = r ? [...r.getClientRects()].filter(x => x.height > 0) : [];
    if (rects.length) scrollTo({ top: scrollY + rects[0].top - 100 });

}
$('#btn-paged').addEventListener('click', (e) => { setPaged(!pagedOn()); e.currentTarget.blur(); });
/* manual paging must not fight the narration follow-scroll */
const muteFollow = () => { nar.followMuteUntil = Date.now() + 4000; nar.follow = false; };
$('#pg-prev').addEventListener('click', (e) => { muteFollow(); gotoPage(paged.page - 1); e.currentTarget.blur(); });
$('#pg-next').addEventListener('click', (e) => { muteFollow(); gotoPage(paged.page + 1); e.currentTarget.blur(); });

/* page turning: arrow keys (when narration isn't using them), wheel and swipe */
document.addEventListener('keydown', (e) => {
  if (!pagedOn() || narOn) return;
  const el = e.target instanceof Element ? e.target : null;
  if (el && el.closest('textarea, input, [contenteditable]')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); muteFollow(); gotoPage(paged.page + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); muteFollow(); gotoPage(paged.page - 1); }
});
let wheelAcc = 0, wheelTs = 0;
addEventListener('wheel', (e) => {
  if (!pagedOn()) return;
  if (e.target instanceof Element && e.target.closest('#drawer, #cbox, #tocpanel, #narbar')) return;
  e.preventDefault();
  const now = Date.now();
  if (now - wheelTs > 250) wheelAcc = 0;
  wheelTs = now;
  wheelAcc += (Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY);
  if (Math.abs(wheelAcc) > 60) { muteFollow(); gotoPage(paged.page + (wheelAcc > 0 ? 1 : -1)); wheelAcc = 0; }
}, { passive: false });
let swipe = null;
doc.addEventListener('touchstart', (e) => {
  swipe = null;
  if (!pagedOn() || !e.touches[0]) return;
  // a drag starting on a handle or note is editing, never a swipe
  const t = e.target instanceof Element ? e.target : null;
  if (t && t.closest('.hand, .gdot, .pgx, mark.hl, #minibar, #cbox')) return;
  swipe = { x: e.touches[0].clientX, y: e.touches[0].clientY };

doc.addEventListener('touchend', (e) => {
  if (!swipe) return;
  const t = e.changedTouches[0], dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
  swipe = null;
  if (dragHand || dragDot) return;             // a note was being stretched
  const sel = getSelection();
  if (sel && !sel.isCollapsed) return;
  if (Math.abs(dx) > 55 && Math.abs(dy) < 70) { muteFollow(); gotoPage(paged.page + (dx < 0 ? 1 : -1)); }

/* --- AI export: excerpt + context paragraph + comment --- */
function blockTextAt(off) {
  const r = rangeFromOffsets(off, Math.min(off + 1, doc.textContent.length));
  let el = r && r.startContainer;
  if (el && el.nodeType === Node.TEXT_NODE) el = el.parentElement;
  const blk = el instanceof Element ? el.closest('.blk, h1, h2, blockquote') : null;
  return blk ? blk.textContent.trim() : '';
}
function buildAiExport() {
  const valid = notes.filter(isValid).sort((a, b) => notePos(a) - notePos(b));
  const title = doc.querySelector('h1')?.textContent || SLUG;
  const by = doc.querySelector('.doc-byline')?.textContent.replace(/\s+/g, ' ').trim() || '';
  const L = [`# Notas de lectura · ${title}`, by, '', `${valid.length} notas sobre el documento «${SLUG}».`, ''];
  valid.forEach((n, i) => {
    L.push(`---`, `## Nota ${i + 1}${n.tag ? ` · ${TAGS[n.tag].label}` : ''}`);
    if (hasFrag(n)) {
      L.push(`**Extracto marcado:** «${n.exact}»`);
      const ctx = blockTextAt(n.start);
      if (ctx && ctx !== n.exact) L.push('', `**Párrafo de contexto:** ${ctx}`);
    } else if (n.anchorOffset != null) {
      const ctx = blockTextAt(n.anchorOffset);
      if (ctx) L.push(`**Nota al margen del párrafo:** ${ctx}`);
    }

  } catch { return false; }
}
$('#exp-ai').addEventListener('click', async () => {
  if (!notes.filter(isValid).length) { toast('No hay notas para exportar'); return; }
  const md = buildAiExport();
  if (navigator.share && matchMedia('(pointer: coarse)').matches) {
    try { await navigator.share({ title: 'Notas de lectura', text: md }); return; } catch {}
  }

});

/* --- export / import to read from another device --- */
$('#exp-json').addEventListener('click', () => {
  const data = {
    schema: 'audiolib/reader-export@1',
    slug: SLUG,
    exported: new Date().toISOString(),
    notes: notes.filter(isValid),
    bookmarks,
    pos: load(posKey(), null),
  };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = `${SLUG.replace(/[^a-z0-9-]/gi, '_')}-notas.json`;
  a.click();

});
$('#imp-json').addEventListener('click', () => $('#imp-file').click());
$('#imp-file').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); } catch { toast('Archivo inválido'); return; }
  if (data.schema !== 'audiolib/reader-export@1' || !Array.isArray(data.notes)) { toast('Archivo inválido'); return; }
  if (data.slug !== SLUG && !confirm(`Estas notas son de «${data.slug}» y este documento es «${SLUG}». ¿Importar igual?`)) return;
  const byId = new Map(notes.map(n => [n.id, n]));
  let added = 0, updated = 0;
  for (const raw of data.notes) {
    // imported notes are untrusted (a shared export): a bad tag/side/id
    // used to break every later repaint, and a "]-quote in id breaks the
    // querySelectors. Sanitize into the shapes the rest of the code assumes.
    if (!raw || typeof raw.id !== 'string' || !/^[\w-]+$/.test(raw.id)) continue;
    const inc = { ...raw };
    delete inc.__proto__;                                    // Object.assign runs the setter otherwise
    if (typeof inc.comment !== 'string') delete inc.comment;
    if (inc.tag != null && !TAGS[inc.tag]) inc.tag = null;
    if (inc.side !== 'right') delete inc.side;               // default 'left'
    if (byId.has(inc.id)) { Object.assign(byId.get(inc.id), inc); updated++; }
    else { notes.push({ comment: '', tag: null, side: 'left', ...inc }); added++; }
  }
  let bmAdded = 0;
  if (Array.isArray(data.bookmarks)) {
    const bmIds = new Set(bookmarks.map(b => b.id));
    for (const b of data.bookmarks) {
      if (b && b.id && !bmIds.has(b.id)) { bookmarks.push(b); bmAdded++; }
    }
    if (bmAdded) saveBookmarks();
  }
  if (data.pos && !load(posKey(), null)) save(posKey(), data.pos);
  persist(); repaint(); renderDrawer(); updateBmBtn();
  toast(`Importadas: ${added} nuevas · ${updated} actualizadas` + (bmAdded ? ` · ${bmAdded} marcadores` : ''));

/* ╔══════════════════════════════════════════════════════════╗
   ║ 12 · Narration mode                                        ║
   ║   One continuous mp3 + timeline.json (turns → sentences    ║
   ║   with ms offsets). Sentences map to document offsets      ║
   ║   and get highlighted via the CSS Custom Highlight API     ║
   ║   (no DOM changes: coexists with the note <mark>s).        ║
   ╚══════════════════════════════════════════════════════════╝ */
let narOn = false;
const nar = {
  ready:false, tl:null, audio:null, sents:[], active:-1, hover:-1,
  followMuteUntil:0, follow:true, rates:[1, 1.25, 1.5], rateIdx:0, raf:null,
};
const nfab = $('#nfab');
const narbar = $('#narbar');
const HL = ('highlights' in CSS) ? { active:new Highlight(), hover:new Highlight() } : null;
if (HL) {
  CSS.highlights.set('nar-active', HL.active);
  CSS.highlights.set('nar-hover', HL.hover);
}
const fmtTime = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
};
const fmtRate = (r) => String(r).replace('.', ',') + '×';

async function initNarration(docParam, fileName) {
  if (!docParam) return;
  let tl = null;
  try {
    const res = await fetch(`lectures/${docParam}/timeline.json`, { cache:'no-store' });
    if (res.ok) tl = await res.json();
  } catch {}
  if (!tl || !tl.turns || tl.source !== fileName) return;   // narration for another variant
  // resolve the audio source: heavy mp3s are build artifacts that may not
  // ship with the repo — local file first, then the catalog's audioUrl
  // (e.g. a GitHub Release asset); with neither, no narration is offered
  let audioSrc = `lectures/${docParam}/${tl.audio}`;
  try {
    const head = await fetch(audioSrc, { method: 'HEAD' });
    if (!head.ok) throw 0;
  } catch {
    const cat = await fetchCatalog();
    const remote = cat?.lectures?.find(L => L.slug === docParam)?.audioUrl;
    // a remote audioUrl (from an untrusted pack) must be plain https, so a
    // pack can't beacon readers over an odd scheme or leak more than the fetch
    let ok = false;
    try { ok = !!remote && new URL(remote).protocol === 'https:'; } catch {}
    if (!ok) { dlog('nar: audio ausente/ inválido'); return; }
    audioSrc = remote;
  }
  nar.tl = tl;
  // map each timeline sentence to doc.textContent offsets;
  // the cursor advances to tolerate repeated text
  const docText = doc.textContent;
  let cursor = 0;
  for (const t of tl.turns) for (const s of t.sentences) {
    const i = docText.indexOf(s.text, cursor);
    if (i >= 0) { s.start = i; s.end = i + s.text.length; cursor = s.end; }
    else { s.start = s.end = -1; dlog('nar: oración sin mapear'); }
    nar.sents.push(s);
  }
  const a = new Audio(audioSrc);
  a.preload = 'metadata';
  a.addEventListener('error', () => {           // unreachable/broken mp3:
    if (nar.audio !== a) return;                // withdraw the dead player
    narbar.classList.remove('playing'); stopLoop();
    setNar(false);
    nar.ready = false; nfab.hidden = true;
    toast('No se pudo cargar la narración');
  });
  let lastProgSave = 0;
  a.addEventListener('timeupdate', () => {       // audio progress, every ~5 s
    if (!a.paused && Date.now() - lastProgSave > 5000) { lastProgSave = Date.now(); saveProgress(); }
  });
  a.addEventListener('play',  () => {
    narbar.classList.add('playing');
    nar.follow = true;
    revealActive();      // if you navigated far while paused, play brings you back to the sentence
    narLoop();
  });
  a.addEventListener('pause', () => { narbar.classList.remove('playing'); stopLoop(); narTick(); });
  a.addEventListener('ended', () => { narbar.classList.remove('playing'); stopLoop(); setActiveSent(-1); });
  nar.audio = a;
  nar.rateIdx = Math.max(0, nar.rates.indexOf(prefs.rate ?? 1));
  a.playbackRate = nar.rates[nar.rateIdx];
  $('#nb-rate').textContent = fmtRate(nar.rates[nar.rateIdx]);
  $('#nb-total').textContent = fmtTime(tl.total_ms);
  nar.ready = true;
  nfab.hidden = false;
  if (pagedOn()) layoutPages(firstVisibleOffset());
}

function setNar(on) {
  if (!nar.ready) return;
  narOn = on;
  nfab.classList.toggle('on', on);
  nfab.setAttribute('aria-pressed', String(on));
  nfab.dataset.tip = on ? 'Salir de narración' : 'Modo narración';
  document.body.classList.toggle('nar-on', on);
  doc.classList.toggle('nar', on);
  narbar.classList.toggle('on', on);
  if (on) {
    $('#modechip-txt').textContent = 'Modo narración · tocá una oración para escucharla desde ahí';
    $('#modechip').classList.add('on');
    narTick();
    refreshNar();     // narTick doesn't repaint if the active sentence didn't change
  } else {
    nar.audio.pause();                       // on return: play to resume
    $('#modechip').classList.remove('on');

  }
}

/* --- highlights --- */
function sentRange(s) {
  return (s && s.start >= 0) ? rangeFromOffsets(s.start, s.end) : null;
}
function setActiveSent(idx) {
  if (idx === nar.active) return;
  nar.active = idx;
  refreshNar();
}
function setHoverSent(idx) {
  if (idx === nar.hover) return;
  nar.hover = idx;
  if (!HL) return;
  HL.hover.clear();
  if (narOn && idx >= 0 && idx !== nar.active) {
    const r = sentRange(nar.sents[idx]);
    if (r) HL.hover.add(r);
  }
}
function refreshNar() {
  if (!HL || !nar.ready) return;
  HL.active.clear();
  if (narOn && nar.active >= 0) {
    const r = sentRange(nar.sents[nar.active]);
    if (r) HL.active.add(r);
  }
}

/* --- time → sentence: the last one whose start_ms <= ms --- */
function sentAtTime(ms) {
  const arr = nar.sents;
  let lo = 0, hi = arr.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid].start_ms <= ms) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}
function narTick() {
  if (!nar.audio) return;
  const ms = nar.audio.currentTime * 1000;
  $('#nb-cur').textContent = fmtTime(ms);
  $('#nb-fill').style.width = (nar.tl.total_ms ? Math.min(100, ms / nar.tl.total_ms * 100) : 0) + '%';
  setActiveSent(sentAtTime(ms));
  autoFollow();
}
function narLoop() {
  stopLoop();
  const step = () => { narTick(); nar.raf = requestAnimationFrame(step); };
  nar.raf = requestAnimationFrame(step);
}
function stopLoop() {
  if (nar.raf) { cancelAnimationFrame(nar.raf); nar.raf = null; }
}

/* --- autoscroll that follows the reading; off for 4 s if the user scrolls --- */
/* brings the view to the active sentence (on play after navigating far) */
function revealActive() {
  const r = sentRange(nar.sents[nar.active]);
  if (!r) return;
  const rects = [...r.getClientRects()].filter(x => x.height > 0);
  if (!rects.length) return;
  if (pagedOn()) {
    const pg = pageOfRect(rects[0].left);
    if (pg !== paged.page) gotoPage(pg, false);
  } else if (rects[0].top < 70 || rects[0].top > innerHeight - 160) {
    scrollTo({ top: scrollY + rects[0].top - innerHeight * 0.32 });
  }
}
/* A sentence crossing pages has no per-word timestamps: time is
   interpolated by character position to turn the page exactly when
   the audio enters the following part. */
function pageOfChar(i) {
  const r = rangeFromOffsets(i, Math.min(i + 1, doc.textContent.length));
  const rects = r ? [...r.getClientRects()].filter(x => x.width || x.height) : [];
  return rects.length ? pageOfRect(rects[0].left) : -1;
}
function sentBreaks(s) {
  if (s._epoch === paged.epoch) return s._breaks;
  const breaks = [];
  let curPage = pageOfChar(s.start), from = s.start;
  for (let guard = 0; guard < 6; guard++) {
    let lo = from, hi = s.end - 1, found = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      (pageOfChar(mid) > curPage) ? (found = mid, hi = mid - 1) : (lo = mid + 1);
    }
    if (found < 0) break;
    curPage = pageOfChar(found);
    const frac = (found - s.start) / Math.max(1, s.end - s.start);
    breaks.push({ page: curPage, t: s.start_ms + frac * (s.end_ms - s.start_ms) });
    from = found;
  }
